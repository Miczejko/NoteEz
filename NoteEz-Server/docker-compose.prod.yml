services:
  postgres:
    image: postgres:16-alpine
    container_name: noteez-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=noteez
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=noteez
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U noteez -d noteez
      interval: 10s
      retries: 10
      start_period: 10s
    networks:
      - web

  api:
    build:
      context: .
      dockerfile: NoteEz-Server/Dockerfile
    container_name: noteez-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    expose:
      - "8080"
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: noteez-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    networks:
      - web

  certbot:
    image: certbot/certbot
    container_name: noteez-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

networks:
  web:

volumes:
  certbot_www:
  certbot_conf:
  postgres_data:
