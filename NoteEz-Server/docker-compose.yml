services:
  postgres-noteez:
    image: postgres:16-alpine
    container_name: postgres-noteez
    environment:
      - POSTGRES_USER=noteez
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=noteez
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U noteez -d noteez
      interval: 10s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: NoteEz-Server/Dockerfile
    container_name: noteez-api
    depends_on:
      postgres-noteez:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__BlobStorage=${AZURE_BLOB_CONNECTION_STRING}
      - BlobStorage__ContainerName=${AZURE_BLOB_CONTAINER_NAME}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      - Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_LAN:-http://localhost:5173}
      - Resend__ApiKey=${MAIL_KEY}
      - Resend__FromEmail=${MAIL_FROM_EMAIL}
      - Resend__FromName=${MAIL_FROM_NAME:-NoteEz}
      - App__FrontendBaseUrl=${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      - App__BackendBaseUrl=${BACKEND_BASE_URL:-http://localhost:8080}
      - Turnstile__SecretKey=${TURNSTILE_SECRET_KEY:-1x0000000000000000000000000000000AA}
    ports:
      - "8080:8080"

volumes:
  postgres_data: